# Render Blueprint: one free web service built from the root Dockerfile.
# The database is external (Neon free Postgres): paste its connection details when Render asks.
services:
  - type: web
    name: tripcraft
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: gemini
      - key: AI_API_KEY
        sync: false # secret, entered in the Render dashboard
      - key: SPRING_DATASOURCE_URL
        sync: false # jdbc:postgresql://<neon-host>/<db>?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
