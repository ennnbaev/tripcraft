spring:
  application:
    name: tripcraft

  # Local secrets: AI_API_KEY can live in the repo-root .env (git-ignored) instead of an exported variable
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  # Overridden in deploys by SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
  datasource:
    url: jdbc:postgresql://localhost:5432/tripcraft
    username: tripcraft
    password: tripcraft
    hikari:
      maximum-pool-size: 5   # small free-tier databases (Neon) limit connections

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway
    open-in-view: false

  flyway:
    enabled: true

  # The UI is English: validation messages must not follow the JVM or browser locale
  web:
    locale: en
    locale-resolver: fixed

  # ---- AI provider (OpenAI-compatible API) ----
  # Switch provider with SPRING_PROFILES_ACTIVE=gemini | groq | openai | mock
  ai:
    model:
      # Only the chat model is used; keep the other OpenAI clients off.
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      api-key: ${AI_API_KEY:missing}
      chat:
        options:
          temperature: 0.3
    # Built-in retry covers transient 5xx/network errors only (4xx, incl. 429, is not retried).
    # Kept small so we don't burn free-tier quota.
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s

server:
  port: ${PORT:8080}   # hosting platforms (Render) pass the port in PORT
  # Behind an HTTPS proxy (Render, nginx) trust X-Forwarded-Proto/Host, otherwise same-origin POSTs look cross-origin (403)
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  ai:
    prompt-version: v1
    provider: openai
    model: ${spring.ai.openai.chat.options.model:gpt-4o-mini}
    timeout: 60s

---
spring:
  config:
    activate:
      on-profile: gemini
  ai:
    openai:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        completions-path: /chat/completions
        options:
          model: gemini-3.5-flash-lite
app:
  ai:
    provider: gemini

---
spring:
  config:
    activate:
      on-profile: groq
  ai:
    openai:
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: openai/gpt-oss-120b
app:
  ai:
    provider: groq

---
spring:
  config:
    activate:
      on-profile: openai
  ai:
    openai:
      chat:
        options:
          model: gpt-4o-mini
app:
  ai:
    provider: openai

---
# Dev/demo profile: a fake ChatModel (com.tripcraft.ai.mock.MockChatModel) answers instead of a real LLM.
# Lets you run the whole app without an API key.
spring:
  config:
    activate:
      on-profile: mock
  ai:
    model:
      chat: mock   # disables the OpenAI chat auto-configuration
app:
  ai:
    provider: mock
    model: mock-planner
