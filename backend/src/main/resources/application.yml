spring:
  application:
    name: tripcraft

  datasource:
    url: jdbc:postgresql://localhost:5432/tripcraft
    username: tripcraft
    password: tripcraft

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway
    open-in-view: false

  flyway:
    enabled: true

  # The UI is English: validation messages must not follow the JVM or browser locale
  web:
    locale: en
    locale-resolver: fixed

  # ---- AI provider (OpenAI-compatible API) ----
  # Switch provider with SPRING_PROFILES_ACTIVE=gemini | groq | openai | mock
  ai:
    model:
      # Only the chat model is used; keep the other OpenAI clients off.
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      api-key: ${AI_API_KEY:missing}
      chat:
        options:
          temperature: 0.3
    # Built-in retry covers transient 5xx/network errors only (4xx, incl. 429, is not retried).
    # Kept small so we don't burn free-tier quota.
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  ai:
    prompt-version: v1
    provider: openai
    model: ${spring.ai.openai.chat.options.model:gpt-4o-mini}
    timeout: 60s

---
spring:
  config:
    activate:
      on-profile: gemini
  ai:
    openai:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        completions-path: /chat/completions
        options:
          model: gemini-3.8-flash
app:
  ai:
    provider: gemini

---
spring:
  config:
    activate:
      on-profile: groq
  ai:
    openai:
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: openai/gpt-oss-120b
app:
  ai:
    provider: groq

---
spring:
  config:
    activate:
      on-profile: openai
  ai:
    openai:
      chat:
        options:
          model: gpt-4o-mini
app:
  ai:
    provider: openai

---
# Dev/demo profile: a fake ChatModel (com.tripcraft.ai.mock.MockChatModel) answers instead of a real LLM.
# Lets you run the whole app without an API key.
spring:
  config:
    activate:
      on-profile: mock
  ai:
    model:
      chat: mock   # disables the OpenAI chat auto-configuration
app:
  ai:
    provider: mock
    model: mock-planner
