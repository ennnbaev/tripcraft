services:
  postgres:
    image: postgres:17
    container_name: tripcraft-db
    environment:
      POSTGRES_DB: tripcraft
      POSTGRES_USER: tripcraft
      POSTGRES_PASSWORD: tripcraft
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripcraft -d tripcraft"]
      interval: 5s
      retries: 10

  # The services below run the whole app: docker compose up -d --build
  # For local development start only the database: docker compose up -d postgres
  backend:
    build: ./backend
    container_name: tripcraft-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-gemini}
      AI_API_KEY: ${AI_API_KEY:-missing}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tripcraft
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: tripcraft-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  pgdata:
