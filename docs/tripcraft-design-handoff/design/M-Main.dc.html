<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New trip · mobile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tripcraft.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&amp;family=Rubik:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; min-height: 1950px; background: #0f3e4a; font-family: Rubik, 'Segoe UI', system-ui, sans-serif; color: #0f3e4a">
<dc-import name="Main" prefix="M-" theme="{{theme}}" hint-size="390px,1950px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":1950}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
