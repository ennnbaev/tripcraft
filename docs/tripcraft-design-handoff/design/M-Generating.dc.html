<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Generating · mobile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tripcraft.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&amp;family=Rubik:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; min-height: 1100px; background: #f1f8fa; font-family: Rubik, 'Segoe UI', system-ui, sans-serif; color: #0f3e4a">
<dc-import name="Generating" prefix="M-" theme="{{theme}}" outcome="{{outcome}}" hint-size="390px,1100px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"outcome":{"editor":"enum","options":["success","rate-limited (429)","AI error (502)"],"default":"success"},"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light', outcome: this.props.outcome ?? 'success' };
  }
}
</script>
</body>
</html>
